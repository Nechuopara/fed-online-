<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Menu</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
<button class="burger_menu">
    <img src="img/burger-menu.png" alt="nav menu">
</button>
<div class="title">
    <h2>
        Menu
    </h2>
</div>
    <from class="input-menu" action="">
        <input type="text" placeholder="Search food here">
    </from>                                                 <!--Як для мене я звик вкористовувати тільки div,
                                                            не знаю правильно чи ні так але поки робитиму так,
                                                            напишіть будьласка можна використовувати тільки div?--->
    <div class="menu_items">
        <div class="food menu-card">
            <div class="food_img menu-card_img">
                <img src="img/food.png" alt="food image">
            </div>
            <div class="food_title menu-card_title">
                <h2>Food</h2>
            </div>
        </div>
        <div class="drinks menu-card">
            <div class="drinks_img menu-card_img" >
                <img src="img/emojione_tropical-drink.png" alt="drink image">
            </div>
            <div class="drinks_title menu-card_title">
                <h2>Drinks</h2>
            </div>
        </div>
        <div class="desert menu-card">
            <div class="desert_img menu-card_img">
                <img src="img/desert.png" alt="desert image">
            </div>
            <div class="desert_title menu-card_title">
                <h2>Desert</h2>
            </div>
        </div>
    </div>
 <div class="menu">
     <div class="title_menu">
         <h2>Burger</h2>
     </div>
     <div class="food_list">

         <div class="big-mag food-cart">
             <div class="big-mag_img food-cart_img">
                 <img src="img/big-mag.png" alt="food">
             </div>

             <div class="big-mag_info food-cart_info">
                 <div class="big-mag_title food-cart_title">
                     <h1>Big Mag</h1>
                 </div>
                 <div class="big-mag_prise food-cart_prise">
                     <p>Rs 240</p>
                 </div>
             </div>
         </div>

         <div class="kfc-double food-cart">
             <div class="kfc-double_img food-cart_img">
                 <img src="img/kfc-double.png" alt="food">
             </div>

             <div class="kfc-double_info food-cart_info">
                 <div class="kfc-double_title food-cart_title">
                     <h1>KFC Double </h1>
                 </div>
                 <div class="kfc-double_prise food-cart_prise">
                     <p>Rs 252</p>
                 </div>
             </div>
         </div>

         <div class="fish-burger food-cart">
             <div class="fish-burger_img food-cart_img">
                 <img src="img/fish-burger.png" alt="food">
             </div>

             <div class="fish-burger_info food-cart_info">
                 <div class="fish-burger_title food-cart_title">
                     <h1>Fish Burger</h1>
                 </div>
                 <div class="fish-burger_prise food-cart_prise">
                     <p>Rs 220</p>
                 </div>
             </div>
         </div>
     </div>
 </div>
</div>
</body>
</html>
